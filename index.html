<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Habits</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Подключаем Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Плавные переходы для интерактивных элементов */
        .habit-card {
            transition: all 0.2s ease-in-out;
        }
        /* Безопасное принудительное отображение текста в темной теме Telegram */
        .theme-dependent-text {
            color: var(--tg-theme-text-color, #111827);
        }
        @media (prefers-color-scheme: dark) {
            .theme-dependent-text {
                color: var(--tg-theme-text-color, #f9fafb);
            }
        }
    </style>
</head>
<body class="bg-[--tg-theme-bg-color, #fafafa] text-[--tg-theme-text-color, #111827] dark:bg-[#18222d] dark:text-[#f5f5f5] font-sans antialiased min-h-screen p-4 flex flex-col justify-between selection:bg-teal-500/30">

    <!-- Основной контейнер приложения -->
    <main id="main-content" class="w-full max-w-md mx-auto space-y-6 flex-grow flex flex-col">
        
        <!-- Шапка и Прогресс -->
        <header class="text-center space-y-3 pt-4">
            <h1 class="text-2xl font-bold tracking-tight theme-dependent-text">Мой День</h1>
            <p class="text-sm opacity-60 theme-dependent-text" id="date-string">Загрузка даты...</p>
            
            <!-- Прогресс-бар -->
            <div class="space-y-2">
                <div class="flex justify-between text-xs font-semibold px-1">
                    <span class="theme-dependent-text opacity-80">Прогресс</span>
                    <span id="progress-text" class="theme-dependent-text font-bold">0%</span>
                </div>
                <div class="w-full bg-gray-200 dark:bg-gray-800 h-3 rounded-full overflow-hidden shadow-inner">
                    <div id="progress-bar" class="bg-gradient-to-r from-teal-400 to-emerald-500 h-full w-0 transition-all duration-500 ease-out"></div>
                </div>
            </div>
        </header>

        <!-- Контейнер со списками (Привычки ИЛИ Экран Успеха) -->
        <div id="content-slider" class="flex-grow flex flex-col justify-center py-4">
            <!-- Список привычек -->
            <section class="space-y-3 w-full" id="habits-container">
                <!-- Сюда JS добавит привычки -->
            </section>

            <!-- Финальный экран (скрыт по умолчанию) -->
            <section id="success-screen" class="hidden flex-col items-center justify-center text-center space-y-4 py-8 animate-fade-in">
                <div class="w-24 h-24 rounded-full bg-emerald-500/20 text-emerald-500 flex items-center justify-center text-5xl shadow-lg border border-emerald-500/30 animate-bounce">
                    ✓
                </div>
                <h2 class="text-xl font-bold tracking-tight theme-dependent-text">Отличная работа!</h2>
                <p class="text-base text-emerald-500 dark:text-emerald-400 font-medium px-4">
                    Все цели на сегодня выполнены
                </p>
            </section>
        </div>

    </main>

    <!-- Нижняя панель с кнопкой обновления -->
    <footer class="w-full max-w-md mx-auto pt-4 pb-2">
        <button id="reset-btn" class="w-full py-3 px-4 rounded-xl font-medium text-sm text-center border border-dashed border-gray-300 dark:border-gray-700 opacity-50 text-[--tg-theme-text-color] dark:text-[#f5f5f5] hover:opacity-100 active:scale-[0.98] transition-all cursor-pointer">
            🔄 Получить новые привычки
        </button>
    </footer>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Пул из 15 микро-привычек
        const habitsPool = [
            { id: 1, text: "Выпить стакан чистой воды", icon: "💧" },
            { id: 2, text: "Сделать 5 глубоких вдохов и выдохов", icon: "🧘" },
            { id: 3, text: "Сделать 10 приседаний или разминку", icon: "🏋️" },
            { id: 4, text: "5 минут побыть в полной тишине", icon: "🤫" },
            { id: 5, text: "Прочитать 2 страницы полезной книги", icon: "📖" },
            { id: 6, text: "Навести порядок на рабочем столе", icon: "🧼" },
            { id: 7, text: "Записать 1 главную цель на сегодня", icon: "🎯" },
            { id: 8, text: "Сделать легкую разминку для глаз", icon: "👁️" },
            { id: 9, text: "Поблагодарить мысленно за 3 вещи", icon: "✨" },
            { id: 10, text: "Убрать телефон за 30 минут до сна", icon: "📵" },
            { id: 11, text: "Съесть один свежий фрукт или овощ", icon: "🍏" },
            { id: 12, text: "Проверить осанку прямо сейчас", icon: "🧍" },
            { id: 13, text: "Выбросить 3 ненужные вещи или бумажки", icon: "🗑️" },
            { id: 14, text: "Сказать близкому человеку что-то приятное", icon: "❤️" },
            { id: 15, text: "Составить список задач на завтра", icon: "📝" }
        ];

        let currentHabits = [];

        // Настройка отображения даты
        function setDate() {
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date-string').innerText = new Date().toLocaleDateString('ru-RU', options);
        }

        // Случайные привычки
        function getRandomHabits() {
            const shuffled = [...habitsPool].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 3).map(h => ({ ...h, completed: false }));
        }

        // Загрузка состояния
        function loadHabits() {
            const saved = localStorage.getItem('tg_mini_app_habits');
            const savedDate = localStorage.getItem('tg_mini_app_habits_date');
            const today = new Date().toDateString();

            if (saved && savedDate === today) {
                currentHabits = JSON.parse(saved);
            } else {
                currentHabits = getRandomHabits();
                saveHabits(today);
            }
            renderHabits();
        }

        // Сохранение
        function saveHabits(dateString = null) {
            localStorage.setItem('tg_mini_app_habits', JSON.stringify(currentHabits));
            if (dateString) {
                localStorage.setItem('tg_mini_app_habits_date', dateString);
            }
        }

        // Переключение статуса задачи
        function toggleHabit(index) {
            currentHabits[index].completed = !currentHabits[index].completed;
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            saveHabits();
            renderHabits();
        }

        // Отрисовка элементов интерфейса
        function renderHabits() {
            const container = document.getElementById('habits-container');
            const successScreen = document.getElementById('success-screen');
            container.innerHTML = '';

            const completedCount = currentHabits.filter(h => h.completed).length;
            const percentage = Math.round((completedCount / currentHabits.length) * 100) || 0;
            
            // Обновляем прогресс-бар
            document.getElementById('progress-text').innerText = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            // Если все задачи выполнены, показываем праздничный экран
            if (percentage === 100) {
                container.classList.add('hidden');
                successScreen.classList.remove('hidden');
                successScreen.classList.add('flex');
                
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } else {
                // Если не все выполнены, показываем стандартный список
                container.classList.remove('hidden');
                successScreen.classList.add('hidden');
                successScreen.classList.remove('flex');
            }

            // Генерируем карточки привычек
            currentHabits.forEach((habit, index) => {
                const card = document.createElement('div');
                
                const baseClasses = "habit-card flex items-center justify-between p-4 rounded-xl border cursor-pointer select-none transition-colors ";
                const stateClasses = habit.completed 
                    ? "bg-emerald-500/10 border-emerald-500/40 opacity-50 line-through text-[--tg-theme-text-color] dark:text-[#f5f5f5]" 
                    : "bg-[--tg-theme-secondary-bg-color, #ffffff] dark:bg-[#24303f] border-gray-200 dark:border-gray-800 text-[--tg-theme-text-color] dark:text-[#f5f5f5] hover:border-teal-500/40 shadow-sm";

                card.className = baseClasses + stateClasses;
                card.onclick = () => toggleHabit(index);

                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-2xl">${habit.icon}</span>
                        <span class="text-sm font-medium tracking-wide">${habit.text}</span>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${
                        habit.completed 
                        ? 'bg-emerald-500 border-emerald-500 text-white' 
                        : 'border-gray-400 dark:border-gray-600'
                    }">
                        ${habit.completed ? '✓' : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Логика кнопки сброса/обновления задач
        document.getElementById('reset-btn').onclick = () => {
            if (confirm("Хотите сбросить прогресс и обновить список привычек на сегодня?")) {
                currentHabits = getRandomHabits();
                saveHabits(new Date().toDateString());
                renderHabits();
            }
        };

        // Старт
        setDate();
        loadHabits();
    </script>
</body>
</html>
